{% extends "base.html" %}

{% block content %}

<h1>User Registration</h1>

<form method="POST">

    <input
        type="text"
        name="full_name"
        placeholder="Enter Full Name"
        required
    >

    <br><br>

    <input
        type="text"
        name="username"
        placeholder="Enter Username"
        required
    >

    <br><br>

    <input
        type="password"
        name="password"
        placeholder="Enter Password"
        required
    >

    <br><br>

    <button type="submit">
        Register
    </button>

</form>

{% endblock %}
